# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    sn.dove.backend: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: false

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DOVE_DATABASE_URL:jdbc:postgresql://localhost:5432/doveBackend}
    username: ${DOVE_DATABASE_USERNAME:doveBackend}
    password: ${DOVE_DATABASE_PASSWORD:}
    hikari:
      poolName: Hikari
      auto-commit: false
      # Sized for a pooled Neon Postgres endpoint serving ~4000 users/day from a small
      # number (1-3) of backend instances. Kept modest per-instance because the real
      # ceiling is Neon's plan-level max connections, shared across every instance and
      # any other client of the same project - we don't have visibility into that number
      # here, so these are conservative defaults, not a tuned figure. Revisit if the
      # instance count grows or if pool-exhaustion errors show up in logs/metrics.
      maximum-pool-size: 12
      minimum-idle: 3
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DOVE_KEYCLOAK_ISSUER_URI}
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias dovebackend -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  shutdown: graceful # see https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html#web.graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cors:
    allowed-origins: ${DOVE_ALLOWED_ORIGINS:https://dove.sonatel.sn}
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-Dove-Total-Count,X-Dove-Page,X-Dove-Page-Size'
    allow-credentials: true
    max-age: 1800
  security:
    oauth2:
      audience:
        - ${DOVE_KEYCLOAK_AUDIENCE:dove-api}
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  cache: # Cache configuration
    caffeine: # Caffeine configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache. This sets expireAfterWrite in Caffeine (https://github.com/ben-manes/caffeine/wiki/Eviction#time-based)
      max-entries: 1000 # Number of objects in each cache entry
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
dove:
  seed:
    enabled: false
  auth:
    dev-header-enabled: false
    web-client-id: ${DOVE_KEYCLOAK_WEB_CLIENT_ID:dove-web}
  storage:
    # TEMPORARY: defaults to local disk storage. The Sonatel object-storage gateway
    # (DOVE_STORAGE_GATEWAY_URL) is not confirmed live yet, and GatewayObjectStorageService
    # refuses to start (IllegalStateException) if that URL is blank - so "gateway" is not a
    # safe default here. Local storage works but is NOT suitable for multi-instance
    # deployment (files land on one instance's disk only). Switch this back to "gateway"
    # once the real endpoint is confirmed live and reachable from prod, then remove this note.
    provider: ${DOVE_STORAGE_PROVIDER:local}
    gateway-base-url: ${DOVE_STORAGE_GATEWAY_URL:}
    gateway-api-key: ${DOVE_STORAGE_GATEWAY_API_KEY:}
    # Only used while provider=local. Not set previously, which meant local storage (if
    # ever active) would silently fall back to the http://localhost:8080 Java default and
    # generate broken media URLs for real users - these make it configurable via env vars.
    local-directory: ${DOVE_STORAGE_LOCAL_DIRECTORY:.dove-storage}
    public-base-url: ${DOVE_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    max-upload-bytes: ${DOVE_STORAGE_MAX_UPLOAD_BYTES:536870912}
