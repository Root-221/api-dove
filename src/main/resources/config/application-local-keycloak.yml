spring:
  devtools:
    restart:
      enabled: false
  docker:
    compose:
      enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:file:./.dove-local-keycloak/database;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: dove
    password: dove
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/DOVE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8080

jhipster:
  cors:
    allowed-origins: 'http://localhost:4200,http://127.0.0.1:4200'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-Dove-Total-Count,X-Dove-Page,X-Dove-Page-Size'
    allow-credentials: true
    max-age: 1800
  security:
    oauth2:
      audience:
        - dove-api

dove:
  seed:
    enabled: true
    location: file:../DoveFront/db.json
  auth:
    dev-header-enabled: false
    web-client-id: dove-web
  storage:
    provider: local
    local-directory: .dove-storage-keycloak
    public-base-url: http://localhost:8080
    max-upload-bytes: 536870912

logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: WARN
    sn.dove.backend: INFO
