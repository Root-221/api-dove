# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: dove-keycloak-local
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: >-
      start-dev --import-realm
      --spi-theme--default--cache-themes=false
      --spi-theme--default--cache-templates=false
      --spi-theme--default--static-max-age=-1
    volumes:
      - keycloak-local-data:/opt/keycloak/data
      - ./realm-config/DOVE-realm.json:/opt/keycloak/data/import/DOVE-realm.json:ro
      - ./realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
      - ./themes/dove:/opt/keycloak/themes/dove:ro
    environment:
      - KC_DB=dev-file
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_FEATURES=scripts
      - KC_HTTP_PORT=9080
      - KC_HTTPS_PORT=9443
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_PORT=9990
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:${DOVE_KEYCLOAK_HTTP_PORT:-9080}:9080
      - 127.0.0.1:${DOVE_KEYCLOAK_HTTPS_PORT:-9443}:9443
    healthcheck:
      test: 'bash /opt/keycloak/health-check.sh'
      interval: 5s
      timeout: 5s
      # Increased retries due to slow Keycloak startup in GitHub Actions using MacOS
      retries: 50
      start_period: 10s
    labels:
      org.springframework.boot.ignore: true

volumes:
  keycloak-local-data:
